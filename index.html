<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glucose Monitor</title>

<style>

body{
margin:0;
font-family:-apple-system;
background:#FF9933;
}

.container{
max-width:520px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:22px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.menu-card{
padding:22px;
border-radius:18px;
margin-bottom:16px;
background:white;
box-shadow:0 6px 18px rgba(0,0,0,0.12);
text-align:center;
font-size:17px;
font-weight:600;
cursor:pointer;
}

.value{
font-size:30px;
font-weight:bold;
text-align:center;
}

input{
width:100%;
padding:14px;
margin-top:12px;
border-radius:14px;
border:1px solid #ddd;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#FF9933;
color:white;
margin-top:12px;
font-size:16px;
}

.hidden{
display:none;
}

canvas{
width:100%;
height:350px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#FF9933;
color:white;
padding:8px;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage">

<div class="card">
<h2>Glucose Monitor</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="showRegister()">Register</button>

</div>

</div>


<!-- REGISTER -->

<div id="registerPage" class="hidden">

<div class="card">

<h2>Register</h2>

<input id="reg_user" placeholder="Username">
<input id="reg_pass" type="password" placeholder="Password">
<input id="name" placeholder="Full Name">

<button onclick="registerUser()">Save</button>
<button onclick="showLogin()">Back</button>

</div>

</div>


<!-- MENU -->

<div id="menuPage" class="hidden">

<div class="card">
<h2 id="welcome"></h2>
</div>

<div class="menu-card" onclick="showMeasure()">📟 Measure</div>
<div class="menu-card" onclick="showGraph()">📈 Graph</div>
<div class="menu-card" onclick="showHistory()">📜 History</div>
<div class="menu-card" onclick="logout()">🚪 Logout</div>

</div>


<!-- MEASURE -->

<div id="measurePage" class="hidden">

<div class="card">
Glucose
<div id="glucose" class="value">--</div>
</div>

<div class="card">
BPM
<div id="bpm" class="value">--</div>
</div>

<button onclick="measure()">Measure</button>
<button onclick="showMenu()">Back</button>

</div>


<!-- GRAPH -->

<div id="graphPage" class="hidden">

<div class="card">
<h3>Graph</h3>
<canvas id="chart"></canvas>
</div>

<button onclick="showMenu()">Back</button>

</div>


<!-- HISTORY -->

<div id="historyPage" class="hidden">

<div class="card">

<h3>History</h3>

<table>
<tr>
<th>Date</th>
<th>Time</th>
<th>Glucose</th>
<th>BPM</th>
</tr>

<tbody id="historyList"></tbody>

</table>

<button onclick="clearHistory()">Clear</button>

</div>

<button onclick="showMenu()">Back</button>

</div>

</div>


<script>

let users=JSON.parse(localStorage.getItem("users"))||[]
let currentUser=""
let history=[]

function showRegister(){
loginPage.classList.add("hidden")
registerPage.classList.remove("hidden")
}

function showLogin(){
registerPage.classList.add("hidden")
loginPage.classList.remove("hidden")
}

function registerUser(){

let newUser={
username:reg_user.value,
password:reg_pass.value,
name:name.value
}

users.push(newUser)
localStorage.setItem("users",JSON.stringify(users))

alert("Register success")
showLogin()

}

function login(){

let found=false

users.forEach(x=>{

if(x.username==user.value && x.password==pass.value){

found=true
currentUser=x.username

history=
JSON.parse(localStorage.getItem("history_"+currentUser))
||[]

welcome.innerHTML="Welcome "+x.name

}

})

if(found){

loginPage.classList.add("hidden")
menuPage.classList.remove("hidden")

}else{

alert("Wrong login")

}

}

function logout(){

menuPage.classList.add("hidden")
loginPage.classList.remove("hidden")

}

function showMenu(){

measurePage.classList.add("hidden")
graphPage.classList.add("hidden")
historyPage.classList.add("hidden")

menuPage.classList.remove("hidden")

}

function showMeasure(){
menuPage.classList.add("hidden")
measurePage.classList.remove("hidden")
}

function showGraph(){
menuPage.classList.add("hidden")
graphPage.classList.remove("hidden")
drawChart()
}

function showHistory(){

menuPage.classList.add("hidden")
historyPage.classList.remove("hidden")

let html=""

history.forEach(d=>{

html+=`
<tr>
<td>${d.date}</td>
<td>${d.time}</td>
<td>${d.glucose}</td>
<td>${d.bpm}</td>
</tr>
`

})

historyList.innerHTML=html

}

function clearHistory(){

history=[]

localStorage.setItem(
"history_"+currentUser,
JSON.stringify(history)
)

showHistory()

}

function measure(){

let glucose=Math.floor(Math.random()*40)+90
let bpm=Math.floor(Math.random()*30)+70

glucoseEl=document.getElementById("glucose")
bpmEl=document.getElementById("bpm")

glucoseEl.innerText=glucose
bpmEl.innerText=bpm

let now=new Date()

history.push({

date:now.toLocaleDateString(),
time:now.toLocaleTimeString(),
glucose:glucose,
bpm:bpm

})

localStorage.setItem(
"history_"+currentUser,
JSON.stringify(history)
)

drawChart()

}

function drawChart(){

const canvas=chart
const ctx=canvas.getContext("2d")

canvas.width=canvas.clientWidth
canvas.height=300

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.beginPath()

history.forEach((d,i)=>{

let x=i*(canvas.width/(history.length-1||1))
let y=canvas.height-(d.glucose*2)

if(i==0) ctx.moveTo(x,y)
else ctx.lineTo(x,y)

})

ctx.strokeStyle="#FF9933"
ctx.lineWidth=3
ctx.stroke()

}

</script>

</body>
</html>
