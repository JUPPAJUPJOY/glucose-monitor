<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

table{
border-collapse:collapse;
}

th{
background:#FF9933;
color:white;
padding:8px;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

body{
margin:0;
font-family:-apple-system;
background:#FF9933;
}

.container{
max-width:520px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:22px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.header{
text-align:center;
}

.menu-card{
padding:22px;
border-radius:18px;
margin-bottom:16px;
background:white;
box-shadow:0 6px 18px rgba(0,0,0,0.12);
text-align:center;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:0.2s;
}

.menu-card:hover{
transform:translateY(-2px);
}

.logout{
background:#fff3f3;
color:#ff4d4d;
}

.value{
font-size:30px;
font-weight:bold;
text-align:center;
}

#status{
font-size:28px;
font-weight:bold;
}

.high{color:red;}
.warning{color:orange;}
.normal{color:green;}

input{
width:100%;
padding:14px;
margin-top:12px;
border-radius:14px;
border:1px solid #ddd;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#FF9933;
color:white;
margin-top:12px;
font-size:16px;
}

.hidden{
display:none;
}

canvas{
width:100%;
height:350px;
}

</style>

</head>

<body>

<div class="container">

<h2>Glucose Monitor</h2>

<div class="card">
Glucose
<div id="glucose" class="value">--</div>
</div>

<div class="card">
BPM
<div id="bpm" class="value">--</div>
</div>

<button onclick="measure()">Measure</button>

</div>

<script>

async function measure(){

let glucose = Math.floor(Math.random()*50)+90
let bpm = Math.floor(Math.random()*30)+70

document.getElementById("glucose").innerText = glucose
document.getElementById("bpm").innerText = bpm

}

</script>

</body>
</html>
