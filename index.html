<script>

let users = JSON.parse(localStorage.getItem("users")) || []
let currentUser=""
let currentName=""
let history=[]

function showRegister(){
loginPage.classList.add("hidden")
registerPage.classList.remove("hidden")
}

function showLogin(){
registerPage.classList.add("hidden")
loginPage.classList.remove("hidden")
}

function registerUser(){

let newUser={
username:reg_user.value,
password:reg_pass.value,
name:name.value
}

users.push(newUser)
localStorage.setItem("users",JSON.stringify(users))

alert("Register Success")
showLogin()

}

function login(){

let found=false

users.forEach(x=>{

if(x.username==user.value &&
   x.password==pass.value){

found=true
currentUser=x.username
currentName=x.name

history =
JSON.parse(
localStorage.getItem("history_"+currentUser)
)||[]

welcomeMenu.innerHTML="Welcome<br>"+currentName

}

})

if(found){

loginPage.classList.add("hidden")
menuPage.classList.remove("hidden")

}else{

alert("Wrong login")

}

}

function logout(){

menuPage.classList.add("hidden")
loginPage.classList.remove("hidden")

}

function showMenu(){

home.classList.add("hidden")
graphPage.classList.add("hidden")
historyPage.classList.add("hidden")

menuPage.classList.remove("hidden")

}

function showMeasure(){
menuPage.classList.add("hidden")
home.classList.remove("hidden")
}

function showGraph(){
menuPage.classList.add("hidden")
graphPage.classList.remove("hidden")
drawChart()
}

function showHistory(){

menuPage.classList.add("hidden")
historyPage.classList.remove("hidden")

let html=""

history.forEach(d=>{

html+=`
<tr>
<td>${d.date}</td>
<td>${d.time}</td>
<td>${d.glucose}</td>
<td>${d.bpm}</td>
</tr>
`

})

historyList.innerHTML=html

}

function clearHistory(){

history=[]

localStorage.setItem(
"history_"+currentUser,
JSON.stringify(history)
)

showHistory()

}

function measure(){

let glucose=Math.floor(Math.random()*40)+90
let bpm=Math.floor(Math.random()*30)+70

document.getElementById("glucose").innerText=glucose
document.getElementById("bpm").innerText=bpm

let now=new Date()

history.push({
date:now.toLocaleDateString(),
time:now.toLocaleTimeString(),
glucose:glucose,
bpm:bpm
})

localStorage.setItem(
"history_"+currentUser,
JSON.stringify(history)
)

drawChart()

}

function drawChart(){

const canvas=chart
const ctx=canvas.getContext("2d")

canvas.width=canvas.clientWidth
canvas.height=300

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.beginPath()

history.forEach((d,i)=>{

let x=i*(canvas.width/(history.length-1||1))
let y=canvas.height-(d.glucose*2)

if(i==0) ctx.moveTo(x,y)
else ctx.lineTo(x,y)

})

ctx.strokeStyle="#FF9933"
ctx.lineWidth=3
ctx.stroke()

}

</script>
